<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150a33"/>
      <stop offset="55%" stop-color="#05030f"/>
      <stop offset="100%" stop-color="#020103"/>
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2fb0"/>
      <stop offset="45%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#2be7ff"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6b21ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6b21ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2fb0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff2fb0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2be7ff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#2be7ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <circle cx="180" cy="90" r="260" fill="url(#glowA)"/>
  <circle cx="1050" cy="60" r="220" fill="url(#glowB)"/>
  <circle cx="620" cy="360" r="300" fill="url(#glowC)"/>

  <g fill="#f4f0ff">
    <circle cx="90" cy="60" r="1.6" opacity="0.8"/>
    <circle cx="150" cy="140" r="1.2" opacity="0.6"/>
    <circle cx="230" cy="50" r="1.8" opacity="0.7"/>
    <circle cx="980" cy="70" r="1.6" opacity="0.7"/>
    <circle cx="1090" cy="150" r="1.3" opacity="0.6"/>
    <circle cx="60" cy="300" r="1.5" opacity="0.6"/>
    <circle cx="1120" cy="300" r="1.7" opacity="0.7"/>
    <circle cx="1000" cy="320" r="1.2" opacity="0.5"/>
    <circle cx="330" cy="330" r="1.3" opacity="0.5"/>
    <circle cx="870" cy="40" r="1.4" opacity="0.6"/>
  </g>

  <text x="600" y="185" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="22" letter-spacing="8" fill="#2be7ff" opacity="0.85">L&#205;NEA 1 DE TODO PROGRAMA</text>

  <text x="600" y="270" text-anchor="middle" font-family="Arial Black, 'Segoe UI', sans-serif" font-weight="900" font-size="96" fill="url(#text)" filter="url(#softGlow)">Hola Mundo 3D</text>

  <text x="600" y="335" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#a89bd1">partículas · neón · CSS 3D real · Three.js</text>
</svg>
